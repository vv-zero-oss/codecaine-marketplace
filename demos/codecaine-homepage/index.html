<html lang="en">

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    />
    <!-- Theme before first paint, so the page never flashes the wrong one.
         Mirrors themeInitScript in src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ds:theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.setAttribute("data-theme", dark ? "dark" : "light");
          r.setAttribute("data-tl-theme", dark ? "dark" : "light");
          r.setAttribute("data-theme-pref", pref);
        } catch (e) {}
      })();
    </script>
    <title>Codecaine — The canvas for your real code</title>

    <link rel="stylesheet" crossorigin href="./assets/index-t5EL26XQ.css">
  </head>

    <div id="root" data-canvas-ignore></div>
