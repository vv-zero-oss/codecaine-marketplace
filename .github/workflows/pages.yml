name: Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Fails when an item changed and the committed site — json/, archives/,
      # index.html — was not regenerated with it. The repository IS the site:
      # Pages deploys it from the branch as committed (see README).
      - run: npm run check
      - name: Build every template
        run: |
          for dir in templates/*/; do
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done

